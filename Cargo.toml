[package]
name = "papilla"
version = "0.1.1"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/Redox-openDriver/papilla"
categories = ["computer-vision", "cryptography", "authentication"]
description = "Сравнение отпечатков пальцев для маленьких сенсоров: свой SIFT и геометрическая проверка, шифрованное хранение"
keywords = ["fingerprint", "biometrics", "sift", "matching", "redox"]

[dependencies]
aes = { version = "0.9.4", optional = true, features = ["zeroize"] }
aes-gcm = { version = "0.11.1", optional = true, features = ["zeroize"] }
aes-gcm-siv = { version = "0.12.1", optional = true, features = ["zeroize"] }
chacha20poly1305 = { version = "0.11.0", optional = true, features = ["zeroize"] }
poly1305 = { version = "0.9.1", optional = true, features = ["zeroize"] }
polyval = { version = "0.7.3", optional = true, features = ["zeroize"] }
getrandom = "0.4.3"
drv-i18n = { git = "https://github.com/Redox-openDriver/drv-i18n", tag = "v0.1.1", optional = true }
zeroize = "1.9.2"

[dev-dependencies]
drv-i18n = { git = "https://github.com/Redox-openDriver/drv-i18n", tag = "v0.1.1" }

[[bin]]
name = "papilla-bench"
path = "src/bin/bench.rs"
required-features = ["bench"]

[features]
default = ["aes-256-gcm-siv"]
aes-256-gcm-siv = ["dep:aes-gcm-siv", "dep:aes", "dep:polyval"]
xchacha20-poly1305 = ["dep:chacha20poly1305", "dep:poly1305"]
bench = ["dep:drv-i18n"]
aes-256-gcm = ["dep:aes-gcm"]
